<title>Corrida dos Heróis</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* fontes locais (OFL-1.1), sem pedir nada a servidores externos */
@font-face{font-family:'Bangers';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/bangers-latin-400-normal.woff2) format('woff2');}
@font-face{font-family:'Lilita One';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/lilita-one-latin-400-normal.woff2) format('woff2');}
@font-face{font-family:'Nunito';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/nunito-latin-600-normal.woff2) format('woff2');}
@font-face{font-family:'Nunito';font-style:normal;font-weight:800;font-display:swap;src:url(fonts/nunito-latin-800-normal.woff2) format('woff2');}
/* Conceito: noite na cidade dos heróis. Tabuleiro 10x10 em serpentina (1 embaixo à esquerda, 100 no alto à esquerda), painel de ação ao lado ou abaixo. Visual de quadrinhos: contornos pretos, sombras duras, cores vivas. */
:root{
  color-scheme:dark;
  --ink:#0d1130; --panel:#171c52; --panel-2:#222a79; --line:#3a44b0;
  --txt:#f5f7ff; --muted:#b4bcf2;
  --yellow:#ffd23f; --red:#ff4d5e; --cyan:#2ee6d6; --green:#4cd964; --orange:#ff9f1c; --pink:#ff6fb5; --violet:#8a6bff;
  --tile:#2b3394; --tile-2:#323ba3;
  --f-comic:'Bangers','Lilita One','Arial Rounded MT Bold',system-ui,sans-serif;
  --f-display:'Bangers','Lilita One','Arial Rounded MT Bold',system-ui,sans-serif;
  --f-body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
body{background:var(--ink);color:var(--txt);font-family:var(--f-body);font-weight:600;font-size:16px;line-height:1.4;
  padding-block:12px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent}
button{font-family:inherit}
[hidden]{display:none!important}
.screen{max-width:1000px;margin:0 auto}

/* botões */
.btn{font-family:var(--f-display);font-size:1.2rem;letter-spacing:.02em;border:3px solid #000;border-radius:14px;padding:10px 18px;background:var(--yellow);color:#1a1200;box-shadow:0 5px 0 #000;cursor:pointer;min-height:52px}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 #000}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.alt{background:var(--cyan);color:#0d1130}
.btn.pw{background:var(--pink);color:#2a0b1c}
.btn.ghost{background:var(--panel-2);color:var(--txt);border-color:var(--line);box-shadow:0 4px 0 #0a0d28}
.btn.sm{font-size:.95rem;padding:6px 12px;min-height:44px}
:focus-visible{outline:3px solid #fff;outline-offset:2px}

/* abertura */
.hero{position:relative;text-align:center;padding:24px 12px 28px;overflow:hidden;border-radius:18px;background:var(--panel);border:3px solid #000;box-shadow:0 5px 0 #000}
.sky{position:absolute;left:0;right:0;bottom:0;width:100%;height:75%;opacity:.9}
.hero>*:not(.sky){position:relative}
.kicker{margin:0;color:var(--cyan);font-weight:800;letter-spacing:.08em;text-transform:uppercase;font-size:.78rem}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(2.5rem,10vw,4.4rem);line-height:1;margin:8px 0 10px;color:var(--yellow);text-shadow:3px 3px 0 #000,-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000;transform:rotate(-1.5deg);text-wrap:balance}
.lede{max-width:46ch;margin:0 auto}
.sect{margin:22px 0 10px;font-family:var(--f-display);font-weight:400;font-size:1.3rem}
.seg{display:flex;gap:10px}
.seg .btn{flex:1}
.seg .btn[aria-pressed=true]{background:var(--yellow);color:#1a1200;border-color:#000;box-shadow:0 5px 0 #000}
.slots{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.slot{background:var(--panel);border:3px solid var(--pc);border-radius:16px;padding:12px;display:grid;gap:10px;min-width:0;align-content:start}
.slot-h{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.slot-h b{font-family:var(--f-display);font-weight:400;font-size:1.15rem;color:var(--pc)}
.tg{font-weight:800;font-size:.9rem;border:2px solid var(--line);background:var(--panel-2);color:var(--txt);border-radius:999px;padding:6px 14px;cursor:pointer;min-height:44px}
.slot input{font:inherit;font-weight:700;width:100%;padding:10px 12px;border-radius:10px;border:2px solid var(--line);background:#0b0f33;color:var(--txt);min-height:44px}
.hgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.hbtn{font-weight:800;font-size:.72rem;display:grid;gap:2px;justify-items:center;padding:4px 2px 6px;border-radius:12px;border:2px solid var(--line);background:linear-gradient(160deg,var(--panel-2) 20%,#141850);color:var(--txt);cursor:pointer;min-width:0;transition:border-color .15s,box-shadow .15s}
.hbtn svg{width:100%;max-width:60px;height:auto}
.hbtn:hover:not(:disabled){border-color:rgba(255,255,255,.3);box-shadow:0 0 0 1px rgba(255,255,255,.1),inset 0 1px 0 rgba(255,255,255,.08)}
.hbtn[aria-pressed=true]{border-color:var(--yellow);background:linear-gradient(160deg,#2d36a0,#1a226c);box-shadow:0 0 0 2px var(--yellow),0 0 22px 5px rgba(255,210,63,.35),inset 0 1px 0 rgba(255,255,255,.15)}
.hbtn:disabled{opacity:.3;cursor:not-allowed}
.pdesc{font-size:.88rem;color:var(--muted);margin:0}
.pdesc b{color:var(--yellow)}
.go{margin:22px auto 8px;display:block;width:min(100%,420px);font-size:1.6rem;min-height:62px}

/* jogo */
.game{display:grid;gap:14px;grid-template-columns:minmax(0,1fr);align-items:start}
@media (min-width:900px){.game{grid-template-columns:minmax(0,640px) minmax(300px,1fr)}}
.topbar{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.turn{flex:1;font-family:var(--f-display);font-size:1.25rem;min-width:0}
/* 2.5D: o tabuleiro é um plano inclinado em perspectiva; os peões ficam em pé e fazem sombra no chão */
.stage{position:relative;width:100%;max-width:700px;margin:0 auto;perspective:1100px;perspective-origin:50% 18%;padding-bottom:4%}
.city{position:absolute;left:-2%;top:0;width:104%;height:40%;opacity:.9;pointer-events:none}
.board{position:relative;aspect-ratio:10/6;width:92%;margin:5% auto 0;transform-style:preserve-3d;transform:rotateX(var(--tilt,30deg));transform-origin:50% 72%;transition:transform .6s}
.stage.flat{--tilt:0deg}
.stage.flat .city{display:none}
@media (max-width:520px){.stage{--tilt:22deg}.city{display:none}.topbar{flex-wrap:wrap}.turn{flex:1 1 100%}.topbar .btn{flex:1}}
.panel .actions{order:-3}.panel .pick{order:-2}.panel .log{order:-1}
.grid{position:absolute;inset:0;display:grid;grid-template:repeat(6,1fr)/repeat(10,1fr);gap:0;padding:3px;background:radial-gradient(circle at 18% 22%,rgba(255,90,200,.34),transparent 36%),radial-gradient(circle at 82% 74%,rgba(46,230,214,.28),transparent 38%),radial-gradient(circle at 52% 48%,rgba(138,107,255,.38),transparent 58%),#070a25;border:4px solid #000;border-radius:18px;transform-style:preserve-3d;box-shadow:0 12px 0 #03051a,0 24px 26px rgba(0,0,0,.55)}
.t{position:relative;display:grid;place-items:center;margin:18%;border-radius:50%;background:var(--tile);color:#fff;min-width:0;border:2px solid rgba(255,255,255,.75);box-shadow:inset 0 -4px 0 rgba(0,0,0,.28),inset 0 2px 0 rgba(255,255,255,.3),0 0 10px rgba(255,255,255,.25),0 3px 0 rgba(0,0,0,.5)}
.sw.t{margin:0;border-radius:9px;transform:none!important;box-shadow:inset 0 -3px 0 rgba(0,0,0,.28),0 2px 0 #000}
.sw.t b,.sw.t.k-plain b{position:static;top:auto;transform:none;background:none;padding:0;font-size:1.2rem}
.board-art{position:absolute;inset:3px;width:calc(100% - 6px);height:calc(100% - 6px);pointer-events:none;transform:translateZ(0)}
.t.k-plain{background:rgba(160,140,255,.22);border-color:rgba(200,185,255,.8);box-shadow:inset 0 0 8px rgba(160,140,255,.5),0 0 8px rgba(160,140,255,.45)}
.t.k-plain.a{background:rgba(110,200,255,.2);border-color:rgba(170,225,255,.8);box-shadow:inset 0 0 8px rgba(110,200,255,.5),0 0 8px rgba(110,200,255,.45)}
.t:not(.k-plain){transform:translateZ(6px)}
.t b{position:absolute;bottom:-5px;left:50%;transform:translateX(-50%);background:#0d1130;color:#fff;border-radius:8px;padding:1px 4px;font-size:clamp(7px,1.7vw,11px);line-height:1.1;font-weight:800;z-index:2}
.t.k-plain b{bottom:auto;top:50%;transform:translate(-50%,-50%);background:none;font-size:clamp(9px,2.3vw,15px);opacity:.95;text-shadow:0 1px 2px #000}
.t svg{width:68%;height:68%}
.t i{position:absolute;font:normal 400 clamp(9px,2.6vw,15px)/1 var(--f-display);color:#0d1130}
.t .lbl{font:normal 400 clamp(7px,1.8vw,11px)/1 var(--f-display);margin-top:30%}
.k-puzzle{--c:var(--violet)}
.k-gift{--c:var(--orange);color:#0d1130}
.k-villain{--c:var(--red)}
.k-energy{--c:var(--cyan);color:#0d1130}
.k-turbo{--c:var(--green);color:#0d1130}
.k-portal{--c:var(--pink);color:#0d1130}
.k-exit{--c:#3a2a6e;border-style:dashed;border-color:var(--pink)}
.k-exit i{color:#fff}
.k-start{--c:var(--green);color:#0d1130}
.k-goal{--c:var(--yellow);color:#0d1130;margin:6%;box-shadow:0 0 22px rgba(255,210,63,.9),0 3px 0 #000}
.k-duel{--c:#00a8e8;color:#0d1130}
.k-wheel{--c:#fff;color:#0d1130}
.tokens{position:absolute;inset:0;pointer-events:none;transform-style:preserve-3d}
.tok{position:absolute;left:5%;top:95%;width:8.8%;aspect-ratio:1;transform-style:preserve-3d;
  transform:translate(calc(-50% + var(--dx,0%)),calc(-50% + var(--dy,0%)));transition:left .3s ease,top .3s ease}
.sh{position:absolute;left:4%;right:4%;top:36%;height:36%;border-radius:50%;background:rgba(0,0,0,.55)}
.pawn{position:absolute;left:0;width:100%;height:150%;bottom:50%;transform-origin:50% 100%;transform:rotateX(calc(-1 * var(--tilt,30deg)));transition:transform .6s}
.hd{position:absolute;top:0;left:0;width:100%;aspect-ratio:1;border-radius:50%;border:3px solid var(--pc,#fff);overflow:hidden;background:#131746;box-shadow:0 3px 0 #000,inset 0 1px 0 rgba(255,255,255,.25);z-index:2}
.hd svg{display:block;width:100%;height:100%}
.bd{position:absolute;left:20%;right:20%;top:68%;bottom:0;background:var(--pc,#fff);border-radius:4px 4px 40% 40%;box-shadow:0 4px 0 #000,inset 0 3px 0 rgba(255,255,255,.3)}
.pawn.on{animation:bob .55s ease-in-out infinite alternate}
.pawn.on .hd{outline:4px solid var(--yellow);outline-offset:1px}
@keyframes bob{to{translate:0 -9%}}
.pop{position:absolute;z-index:20;pointer-events:none;white-space:nowrap;font-family:var(--f-display);font-size:1.7rem;color:#fff;text-shadow:2px 2px 0 #000,-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000;animation:rise 1.2s ease-out forwards}
@keyframes rise{from{transform:translate(-50%,0);opacity:1}to{transform:translate(-50%,-56px);opacity:0}}
.fx-hit{animation:quake .45s}
@keyframes quake{20%{translate:-7px 0}40%{translate:7px 0}60%{translate:-5px 0}80%{translate:5px 0}}
.wheelwrap{position:relative;width:min(300px,76vw);aspect-ratio:1;margin:12px auto 16px}
.wheel{position:absolute;inset:0;border-radius:50%;border:5px solid #000;box-shadow:0 6px 0 #000;transition:transform 3.8s cubic-bezier(.12,.7,.15,1)}
.wheel span{position:absolute;left:50%;top:50%;width:41%;height:2em;margin-top:-1em;line-height:2em;transform-origin:0 50%;text-align:right;padding-right:5%;font-family:var(--f-display);font-size:clamp(.72rem,3.4vw,.95rem);color:#0d1130}
.wp{position:absolute;left:50%;top:-14px;width:0;height:0;border-left:13px solid transparent;border-right:13px solid transparent;border-top:28px solid #fff;transform:translateX(-50%);filter:drop-shadow(0 2px 0 #000);z-index:3}
.hub{position:absolute;left:50%;top:50%;width:18%;aspect-ratio:1;border-radius:50%;background:#0d1130;border:3px solid #fff;transform:translate(-50%,-50%)}
.vs{display:flex;align-items:center;justify-content:center;gap:12px;margin:6px 0 14px;font-family:var(--f-display);font-size:1.6rem}
.vs .av{width:84px;height:84px}
.cnt{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;max-width:300px;margin:6px auto 12px}
.cnt svg{width:100%;height:auto}
.num{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.num .opt{background:var(--yellow);min-height:64px}
.num .opt.done{opacity:.25}
.meter{position:relative;height:46px;border-radius:23px;background:#0b0f33;border:3px solid #000;margin:14px 0 18px;overflow:hidden}
.zone{position:absolute;top:0;bottom:0;background:var(--green);opacity:.85}
.mk{position:absolute;top:-2px;bottom:-2px;width:10px;margin-left:-5px;background:#fff;border:2px solid #000;border-radius:5px}
.words{display:grid;gap:10px}
.words .opt{font-size:1.5rem;background:var(--pink)}

.panel{background:var(--panel);border:3px solid #000;border-radius:16px;padding:14px;display:grid;gap:12px;box-shadow:0 5px 0 #000}
.who{display:flex;gap:12px;align-items:center;min-width:0}
.av{flex:none;width:72px;height:72px;border-radius:50%;background:#131746;border:4px solid var(--pc,#fff);overflow:hidden;box-shadow:0 2px 0 #000}
.av svg{display:block;width:100%;height:100%}
.av.big{width:130px;height:130px;margin:0 auto 8px}
.who h2{font-family:var(--f-display);font-weight:400;margin:0;font-size:1.5rem;line-height:1.1;overflow-wrap:anywhere}
.who small{color:var(--muted)}
.power{background:#0b0f33;border:2px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:6px}
.pn{display:flex;gap:10px;align-items:center;font-size:.92rem}
.pn b{color:var(--pink);font-family:var(--f-display);font-weight:400;font-size:1.1rem}
.pico{flex:none;width:38px;height:38px;border-radius:50%;border:2px solid #000;display:grid;place-items:center;box-shadow:0 2px 0 #000}
.pico svg{width:22px;height:22px;display:block}
.pips{display:flex;gap:6px;align-items:center}
.pips i{width:16px;height:16px;border-radius:50%;background:#2a3290;border:2px solid #000}
.pips i.f{background:var(--yellow);box-shadow:0 0 8px 2px rgba(255,210,63,.6)}
.pips em{font-style:normal;font-weight:800;margin-left:6px;font-size:.88rem;color:var(--muted)}
.actions{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.dicebox{display:flex;gap:10px;min-height:84px;min-width:84px}
.die{width:80px;height:80px;background:#fff;border:4px solid #000;border-radius:16px;box-shadow:0 5px 0 #000;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:8px;gap:2px}
.die s{display:block;border-radius:50%;align-self:center;justify-self:center;width:75%;height:75%}
.die s.p{background:#0d1130}
.dicebox{perspective:420px}
.rolling .die{animation:tumble .5s linear infinite}
@keyframes tumble{from{transform:rotate3d(1,1,0,0deg)}to{transform:rotate3d(1,1,0,360deg)}}
.btns{display:grid;gap:10px;flex:1;min-width:160px}
.pick p{margin:0 0 8px}
.pn6{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.pn6 .btn{padding:6px 0;min-height:48px}
.banner{display:flex;align-items:center;gap:12px;max-width:700px;margin:0 auto 8px;padding:8px 12px;background:#0b0f33;border:3px solid var(--bc,#4ca3ff);border-radius:14px;box-shadow:0 3px 0 rgba(0,0,0,.5);min-height:64px}
.banner .sw{width:46px;height:46px;border-radius:10px}
.banner .sw b{font-size:1.3rem}
.banner .bt{display:flex;flex-direction:column;gap:2px;min-width:0}
.banner .bt b{font-family:var(--f-display);font-size:1.15rem;font-weight:400;line-height:1.15}
.banner .bt span{font-size:.98rem;opacity:.92;line-height:1.25}
.log div{opacity:.55;font-size:.92rem}.log div.cur{opacity:1;font-weight:700;font-size:1.05rem}
.log{min-height:5.6em;font-size:1.05rem;background:#0b0f33;border:2px dashed var(--line);border-radius:12px;padding:10px 12px}
.strip{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chip{display:flex;align-items:center;gap:8px;background:var(--panel-2);border:2px solid var(--pc);border-radius:999px;padding:4px 12px 4px 4px;font-size:.9rem;min-width:0}
.chip.me{background:#3440b8}
.chip .av{width:34px;height:34px;border-width:2px}
.chip b{display:block;line-height:1.1;font-weight:800;overflow-wrap:anywhere}
.chip small{color:var(--muted);font-weight:700}
.legend{margin-top:12px;background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:10px 12px}
.legend summary{cursor:pointer;font-family:var(--f-display);font-size:1.1rem}
.legend ul{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:8px}
.legend li{display:flex;gap:10px;align-items:center;font-size:.9rem}
.sw{flex:none;width:36px;height:36px;border-radius:7px;display:grid;place-items:center}
.sw svg{width:62%;height:62%}

/* janelas */
.modal{position:fixed;inset:0;z-index:50;background:rgba(5,7,25,.84);display:grid;place-items:center;
  padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.card{background:var(--panel);border:4px solid #000;border-radius:20px;box-shadow:0 8px 0 #000;max-width:480px;width:100%;padding:18px;max-height:100%;overflow:auto;text-align:center}
.card h3{font-family:var(--f-display);font-weight:400;font-size:1.7rem;margin:0 0 8px;color:var(--yellow);text-wrap:balance}
.card p{margin:0 0 14px}
.sub{color:var(--muted)}
.btnrow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.rv{display:grid;gap:10px}
.rb{display:flex;align-items:center;gap:12px;text-align:left;font-size:1.1rem;color:var(--txt);background:var(--panel-2);border:3px solid var(--pc);border-radius:14px;padding:8px 12px;cursor:pointer;min-height:64px}
.rb .av{width:48px;height:48px;border-width:3px}
.rb small{color:var(--muted);margin-left:auto}
.res{font-family:var(--f-display);font-size:1.6rem;margin:10px 0 16px!important}
.res.ok{color:var(--green)}
.res.no{color:var(--orange)}
.q{font-family:var(--f-display);font-size:2.6rem;margin:6px 0 14px}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.opt{font-family:var(--f-display);font-size:2rem;padding:10px 4px;border-radius:14px;border:3px solid #000;background:var(--cyan);color:#0d1130;box-shadow:0 5px 0 #000;cursor:pointer;min-height:76px;display:grid;place-items:center}
.opt:active{transform:translateY(4px);box-shadow:0 1px 0 #000}
.opt svg{width:56px;height:56px}
.seq{font-family:var(--f-display);font-size:2rem;letter-spacing:.06em;margin:6px 0 14px}
.simon{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:300px;margin:8px auto}
.pad{aspect-ratio:1.4;border-radius:16px;border:3px solid #000;box-shadow:0 5px 0 #000;cursor:pointer;opacity:.75}
.pad.lit{opacity:1;filter:brightness(1.5) saturate(1.2);transform:translateY(3px);box-shadow:0 2px 0 #000,0 0 20px 6px rgba(255,255,255,.55)}
.mem{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mc{position:relative;aspect-ratio:1;border-radius:14px;border:3px solid #000;background:var(--violet);color:#fff;font-family:var(--f-display);font-size:2rem;cursor:pointer;padding:0}
.mc .face{display:none;position:absolute;inset:0;background:#fff;border-radius:11px;padding:12px}
.mc .face svg{width:100%;height:100%}
.mc.up .face,.mc.got .face{display:block}
.mc.up .back,.mc.got .back{display:none}
.mc.got{opacity:.7}
.whack{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:320px;margin:8px auto}
.hole{aspect-ratio:1;border-radius:50%;border:3px solid #000;background:#0b0f33;cursor:pointer;position:relative;padding:0}
.hole.star{background:var(--yellow)}
.hole.star::after{content:"";position:absolute;inset:14%;background:var(--orange);clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
#fx i{position:absolute;top:-20px;width:10px;height:16px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(115vh) rotate(720deg)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001s!important;transition-duration:.001s!important}}
